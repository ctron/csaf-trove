<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>csaf-trove</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="tailwind-css" href="tailwind.css" />
</head>
<body>
<script>
(function(){var t=localStorage.getItem("theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t)}else{document.documentElement.setAttribute("data-theme",matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}})();
</script>
</body>
</html>

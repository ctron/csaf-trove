[workspace]
resolver = "2"
members = [
    "common",
    "entity",
    "migration",
    "server",
    "dashboard",
]

[workspace.package]
version = "0.1.31"
edition = "2024"

[workspace.dependencies]
actix-web = "4"
bytesize = { version = "2", features = ["serde"] }
bytes = "1"
actix-web-static-files = { version = "4", features = ["static-files-03"] }
actix-ws = "0.4"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
csaf-rs = "0.5"
csaf-trove-common = { path = "common" }
csaf-trove-entity = { path = "entity" }
csaf-trove-migration = { path = "migration" }
csaf-walker = { version = "0.19", default-features = false }
git2 = { version = "0.21", features = ["https"] }
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
hex = "0.4"
hmac = "0.13"
humantime = "2"
humantime-serde = "1"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
libsqlite3-sys = "0.37"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = "0.13"
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "with-time"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
# Raw SQLite diagnostics require SQLx and libsqlite3-sys to be upgraded together.
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
sha2 = "0.11"
static-files = "0.3"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "macros"] }
toml = "1"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
walkdir = "2"
walker-common = "0.19"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
zstd = "0.14"

[workspace]
resolver = "2"
members = [
    "common",
    "server",
    "dashboard",
]

[workspace.package]
version = "0.1.0-alpha.17"
edition = "2024"

[workspace.dependencies]
actix-web = "4"
bytes = "1"
actix-web-static-files = { version = "4", features = ["static-files-03"] }
actix-ws = "0.3"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
csaf-rs = "0.5"
csaf-trove-common = { path = "common" }
csaf-walker = { version = "0.18.0", default-features = false }
git2 = { version = "0.21", features = ["https"] }
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
hex = "0.4"
hmac = "0.13"
humantime = "2"
humantime-serde = "1"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
parking_lot = "0.12"
percent-encoding = "2"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
static-files = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["serde", "serde-well-known"] }
toml = "1"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
walkdir = "2"
walker-common = "0.18.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[patch.crates-io]
csaf-walker = { git = "https://github.com/ctron/csaf-walker.git", branch = "main" }
walker-common = { git = "https://github.com/ctron/csaf-walker.git", branch = "main" }

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install Trunk
        run: cargo binstall --no-confirm trunk

      - name: Build dashboard
        working-directory: dashboard
        run: trunk build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: dashboard/dist/

  build-server:
    needs: build-dashboard
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Download dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: dashboard/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: csaf-trove-server-${{ matrix.target }}
          path: target/release/csaf-trove-server

  release:
    needs: build-server
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download server artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: csaf-trove-server-*

      - name: Prepare release assets
        run: |
          cd artifacts
          for dir in csaf-trove-server-*; do
            target="${dir#csaf-trove-server-}"
            chmod +x "$dir/csaf-trove-server"
            mv "$dir/csaf-trove-server" "csaf-trove-server-${target}"
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/csaf-trove-server-*

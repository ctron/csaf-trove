name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sources/**'
  pull_request:
    paths-ignore:
      - 'sources/**'

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy-dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --manifest-path dashboard/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

  clippy-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Create dashboard placeholder
        run: mkdir -p dashboard/dist && touch dashboard/dist/index.html

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Create dashboard placeholder
        run: mkdir -p dashboard/dist && touch dashboard/dist/index.html

      - name: Test
        run: cargo test --manifest-path server/Cargo.toml

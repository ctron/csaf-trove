name: Check Source

on:
  pull_request:
    paths:
      - 'sources/**'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install csaf-cli
        run: cargo binstall --no-confirm csaf-cli

      - name: Identify changed sources
        id: changes
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} -- sources/ \
            | tee changed_sources.txt

      - name: Validate sources
        run: |
          echo "## CSAF Source Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Domain | Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY

          EXIT_CODE=0
          for src in $(cat changed_sources.txt); do
            domain=$(grep '^domain' "$src" | sed 's/.*= *"\(.*\)"/\1/')

            if csaf metadata "$domain" 2>&1; then
              echo "| ${domain} | metadata | :white_check_mark: OK |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ${domain} | metadata | :x: Failed |" >> $GITHUB_STEP_SUMMARY
              EXIT_CODE=1
            fi

            if csaf discover "$domain" 2>&1; then
              echo "| ${domain} | discover | :white_check_mark: OK |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ${domain} | discover | :x: Failed |" >> $GITHUB_STEP_SUMMARY
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE
